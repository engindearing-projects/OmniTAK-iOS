name: CI

# Build + unit-test the app on every push to main / release/* and on PRs.
# No secrets required: Config.base.xcconfig ships empty token defaults so a
# fresh checkout compiles (the basemap just won't render tiles without a
# Mapbox token — irrelevant for build/test).

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + test (iOS Simulator)
    # macos-26 (default Xcode 26.x) — the Mapbox SDK's compiled swiftinterface
    # references `_LocationEssentials`, a CoreLocation submodule that only exists
    # in the iOS 26 SDK. macos-15's Xcode 16.4 lacks it and fails with ~240×
    # "cannot find type '_LocationEssentials' in scope". Matches local dev (26.5).
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # SPM checkouts (Mapbox, Turf, VLCKit) dominate cold-start time.
      # Keyed on the pbxproj since Package.resolved is not committed —
      # the package pins live in the project's XCRemoteSwiftPackageReference
      # entries.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('OmniTAK.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -nE 's/^ +(iPhone [^(]*[^ (]) +\(.*/\1/p' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available"; xcrun simctl list devices; exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build (for testing)
        run: |
          set -o pipefail
          # Do NOT pass CODE_SIGNING_ALLOWED=NO — it makes Xcode skip embedding
          # SPM binary frameworks (VLCKit, and DittoSwift once it lands), so the
          # test host then dies at launch with dyld "Library not loaded".
          # Simulator builds ad-hoc sign with no identity, so signing is free here.
          xcodebuild build-for-testing \
            -project OmniTAK.xcodeproj \
            -scheme OmniTAKMobile \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData

      - name: Unit tests (OmniTAKMobileTests)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OmniTAK.xcodeproj \
            -scheme OmniTAKMobile \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData
