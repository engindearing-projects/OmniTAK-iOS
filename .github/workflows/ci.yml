name: CI

# Build + unit-test the app on every push to main / release/* and on PRs.
# No secrets required: Config.base.xcconfig ships empty token defaults so a
# fresh checkout compiles (the basemap just won't render tiles without a
# Mapbox token — irrelevant for build/test).

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    # Two toolchains, because they can disagree. Store builds are made with
    # Xcode 27 (iOS 27 SDK), while some contributors are still on Xcode 26.
    # In November 2026 main stopped compiling on Xcode 27.2 (a SwiftUI body in
    # MapViewController timed out in the type checker) while this job, then
    # Xcode 26 only, stayed green. A green run has to mean both.
    #
    # Nothing older than the iOS 26 SDK works: the Mapbox SDK's compiled
    # swiftinterface references `_LocationEssentials`, a CoreLocation submodule
    # that only exists from the iOS 26 SDK on. macos-15's Xcode 16.4 lacks it
    # and fails with ~240× "cannot find type '_LocationEssentials' in scope".
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build + test (iOS Simulator)
            runner: macos-26
            xcode: ''
          - name: Build + test (iOS Simulator, Xcode 27)
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # macos-26 uses the image default (Xcode 26.x). The xcode-27 image
      # defaults to an older 27.x, so pin the version store builds use.
      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Show Xcode version
        run: xcodebuild -version

      # SPM checkouts (Mapbox, Turf, VLCKit) dominate cold-start time.
      # Keyed on the pbxproj since Package.resolved is not committed —
      # the package pins live in the project's XCRemoteSwiftPackageReference
      # entries.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('OmniTAK.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | sed -nE 's/^ +(iPhone [^(]*[^ (]) +\(.*/\1/p' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available"; xcrun simctl list devices; exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build (for testing)
        run: |
          set -o pipefail
          # Do NOT pass CODE_SIGNING_ALLOWED=NO — it makes Xcode skip embedding
          # SPM binary frameworks (VLCKit, and DittoSwift once it lands), so the
          # test host then dies at launch with dyld "Library not loaded".
          # Simulator builds ad-hoc sign with no identity, so signing is free here.
          xcodebuild build-for-testing \
            -project OmniTAK.xcodeproj \
            -scheme OmniTAKMobile \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData

      - name: Unit tests (OmniTAKMobileTests)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OmniTAK.xcodeproj \
            -scheme OmniTAKMobile \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData
